    if(!Q)return true;const s=(r.ticker+' '+r.name+' '+(r.sector||'')).toLowerCase();return s.includes(Q);});
  rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];
    if(typeof x==='string'||typeof y==='string'){x=(x||'').toString().toLowerCase();y=(y||'').toString().toLowerCase();return x<y?-sortDir:x>y?sortDir:0;}
    if(x==null)return 1; if(y==null)return -1; return (x-y)*sortDir;});
  $('#tb').innerHTML=rows.map(r=>`<tr>${COLS.map(c=>`<td class="${(c.kind==='ticker'||c.kind==='name'||c.kind==='plain')?'l':''}">${cell(r,c)}</td>`).join('')}</tr>`).join('');
  $('#foot').textContent=`${rows.length} of ${ROWS.length} companies · sorted by ${sortKey} ${sortDir<0?'↓':'↑'}`;
}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='ticker'||k==='name'||k==='sector')?1:-1;}render();}
$('#q').addEventListener('input',e=>{Q=e.target.value.toLowerCase().trim();render();});
// sector chips
const sectors=[...new Set(ROWS.map(r=>r.sector).filter(Boolean))].sort();
$('#chips').innerHTML=sectors.slice(0,0).map(()=>'').join('');
const sc=$('#chips');
sectors.forEach(s=>{const el=document.createElement('span');el.className='chip';el.textContent=s;
  el.onclick=()=>{sectorFilter=sectorFilter===s?null:s;[...sc.children].forEach(x=>x.classList.toggle('on',x.textContent===sectorFilter));render();};sc.appendChild(el);});
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');}
render();
</script></body></html>
