let sortKey='prism', sortDir=-1, Q='', sectorFilter=null;
const $=s=>document.querySelector(s);
const esc=x=>(x==null?'':''+x).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const fmt=n=>n==null?'—':(''+Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function scoreColor(v){if(v==null)return 'var(--faint)';return v>=7?'var(--good)':v>=5?'var(--acc2)':v>=3?'var(--warn)':'var(--bad)';}
function riskColor(v){if(v==null)return 'var(--faint)';return v>=4?'var(--bad)':v>=2?'var(--warn)':'var(--good)';}
function cell(r,c){const v=r[c.key];
  if(c.kind==='ticker')return `<a href="company_intelligence.html#${encodeURIComponent(v)}">${esc(v)}</a>${r.nifty50?'<span class="n50">N50</span>':''}`;
  if(c.kind==='name')return `<span class="nm">${esc(v)}</span>`;
  if(c.kind==='plain')return esc(v||'—');
  if(v==null)return '<span style="color:var(--faint)">—</span>';
  if(c.kind==='score')return `<span class="sc" style="background:${scoreColor(v)}">${v.toFixed(1)}</span>`;
  if(c.kind==='risk')return `<span class="sc" style="background:${riskColor(v)}">${v.toFixed(1)}</span>`;
  if(c.kind==='pct'){const col=v>=0?'var(--good)':'var(--bad)';return `<b style="color:${col}">${v>=0?'+':''}${v.toFixed(1)}%</b>`;}
  if(c.kind==='money')return fmt(v);
  // plain magnitudes (P/E, P/B, D/E): no good/bad colour — a high P/E is not self-evidently either
  if(c.kind==='num1')return `<b>${v.toFixed(1)}</b>`;
  if(c.kind==='num2')return `<b>${v.toFixed(2)}</b>`;
  return esc(v);}
function render(){
  const hr=$('#hr'); hr.innerHTML=COLS.map(c=>`<th class="${(c.kind==='ticker'||c.kind==='name'||c.kind==='plain')?'l':''} ${c.key===sortKey?'sorted':''}" onclick="sortBy('${c.key}')">${c.label}${c.key===sortKey?(sortDir<0?' ▾':' ▴'):''}</th>`).join('');
  let rows=ROWS.filter(r=>{
    if(sectorFilter&&r.sector!==sectorFilter)return false;
    if(!Q)return true;const s=(r.ticker+' '+r.name+' '+(r.sector||'')).toLowerCase();return s.includes(Q);});
  rows.sort((a,b)=>{let x=a[sortKey],y=b[sortKey];
    if(typeof x==='string'||typeof y==='string'){x=(x||'').toString().toLowerCase();y=(y||'').toString().toLowerCase();return x<y?-sortDir:x>y?sortDir:0;}
    if(x==null)return 1; if(y==null)return -1; return (x-y)*sortDir;});
  $('#tb').innerHTML=rows.map(r=>`<tr>${COLS.map(c=>`<td class="${(c.kind==='ticker'||c.kind==='name'||c.kind==='plain')?'l':''}">${cell(r,c)}</td>`).join('')}</tr>`).join('');
  $('#foot').textContent=`${rows.length} of ${ROWS.length} companies · sorted by ${sortKey} ${sortDir<0?'↓':'↑'}`;
}
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=(k==='ticker'||k==='name'||k==='sector')?1:-1;}render();}
$('#q').addEventListener('input',e=>{Q=e.target.value.toLowerCase().trim();render();});
// sector chips
const sectors=[...new Set(ROWS.map(r=>r.sector).filter(Boolean))].sort();
$('#chips').innerHTML=sectors.slice(0,0).map(()=>'').join('');
const sc=$('#chips');
sectors.forEach(s=>{const el=document.createElement('span');el.className='chip';el.textContent=s;
  el.onclick=()=>{sectorFilter=sectorFilter===s?null:s;[...sc.children].forEach(x=>x.classList.toggle('on',x.textContent===sectorFilter));render();};sc.appendChild(el);});
function toggleTheme(){const r=document.documentElement;const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark');}
render();
</script></body></html>
